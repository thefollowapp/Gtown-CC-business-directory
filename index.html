<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Germantown Area Chamber of Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hunter: #123524;
    --hunter-dark: #0B241A;
    --kelly: #3C9F52;
    --kelly-light: #6FC96C;
    --kelly-pale: #E8F5E9;
    --bg: #F4F7F2;
    --card: #FFFFFF;
    --ink: #16261E;
    --ink-soft: #4B5D53;
    --line: #DCE6DD;
    --gold: #C9A227;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* HEADER */
  header {
    background: var(--hunter);
    color: white;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
    border-bottom: 6px solid var(--kelly);
  }
  .brand {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.4px;
    white-space: nowrap;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .corner-logo {
    position: fixed;
    bottom: 20px;
    right: 20px;
    height: 64px;
    width: auto;
    opacity: 0.92;
    pointer-events: none;
    z-index: 500;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }
  .searchwrap { flex: 1; position: relative; }
  #searchInput {
    width: 100%;
    font-size: 22px;
    font-family: 'Public Sans', sans-serif;
    padding: 14px 20px 14px 52px;
    border-radius: 999px;
    border: none;
    outline: none;
    background: white;
    color: var(--ink);
    caret-color: transparent;
  }
  .searchicon {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; opacity: 0.5; pointer-events: none;
  }
  .clearbtn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--bg); color: var(--ink-soft); font-size: 20px;
    display: none; align-items: center; justify-content: center; cursor: pointer;
  }
  .homebtn {
    background: var(--kelly);
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 999px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* MAIN */
  main { flex: 1; overflow: hidden; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 32px; display: none; }
  .view.active { display: block; }

  /* HOME - category tiles styled like street signs */
  .sectionlabel {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 18px 4px;
  }
  .categorygrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .catsign {
    background: var(--hunter);
    border: 3px solid var(--kelly-light);
    border-radius: 10px;
    padding: 26px 22px;
    cursor: pointer;
    position: relative;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: transform 0.08s ease;
  }
  .catsign:active { transform: scale(0.97); }
  .catsign::before, .catsign::after {
    content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--kelly-light); top: 10px;
  }
  .catsign::before { left: 10px; }
  .catsign::after { right: 10px; }
  .catname {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.15;
  }
  .catcount {
    font-size: 15px;
    color: var(--kelly-light);
    margin-top: 8px;
    font-weight: 600;
  }

  /* CATEGORY / SEARCH LIST */
  .listheader {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  }
  .backbtn {
    background: var(--card);
    border: 2px solid var(--line);
    color: var(--ink);
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .listtitle {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--hunter);
    text-transform: uppercase;
  }
  .letterhead {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--kelly);
    background: var(--kelly-pale);
    padding: 6px 14px;
    border-radius: 6px;
    display: inline-block;
    margin: 22px 0 10px 0;
  }
  .bizrow {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .bizrow:active { background: var(--kelly-pale); }
  .bizname { font-size: 19px; font-weight: 600; color: var(--ink); }
  .bizcat { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .bizarrow { font-size: 22px; color: var(--kelly); }
  .emptystate {
    text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 18px;
  }

  /* DETAIL MODAL */
  .overlay {
    position: fixed; inset: 0; background: rgba(11,36,26,0.55);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px;
  }
  .overlay.active { display: flex; }
  .detailcard {
    background: var(--card); border-radius: var(--radius); padding: 34px;
    max-width: 520px; width: 100%; max-height: 80vh; overflow-y: auto;
    border-top: 8px solid var(--kelly);
  }
  .detailname { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px; color: var(--hunter); margin: 0 0 4px; }
  .detailcat { font-size: 15px; color: var(--kelly); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 18px; }
  .detailrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 17px; }
  .detailrow:first-of-type { border-top: none; }
  .detaillabel { color: var(--ink-soft); min-width: 90px; font-weight: 600; }
  .closebtn {
    margin-top: 24px; width: 100%; padding: 16px; background: var(--hunter); color: white;
    border: none; border-radius: 999px; font-weight: 700; font-size: 18px; cursor: pointer;
  }

  /* ON-SCREEN KEYBOARD */
  #keyboard {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--hunter-dark);
    padding: 14px; display: none; z-index: 60; border-top: 4px solid var(--kelly);
  }
  #keyboard.active { display: block; }
  .kbrow { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
  .kbkey {
    background: #26433380; border: none; color: white; font-family: 'Public Sans', sans-serif;
    font-size: 20px; font-weight: 600; padding: 14px 0; border-radius: 8px; cursor: pointer;
    flex: 1; max-width: 60px; text-transform: uppercase;
  }
  .kbkey:active { background: var(--kelly); }
  .kbkey.wide { max-width: 140px; }
  .kbkey.space { max-width: none; flex: 3; }
  .kbkey.done { background: var(--kelly); max-width: 100px; }

  /* ADMIN GEAR */
  #adminGear {
    position: fixed; bottom: 14px; right: 14px; width: 26px; height: 26px;
    opacity: 0.15; border: none; background: transparent; cursor: pointer; z-index: 40;
  }
  #adminGear svg { width: 100%; height: 100%; fill: var(--ink); }

  /* ADMIN PANEL */
  #adminOverlay {
    position: fixed; inset: 0; background: rgba(11,36,26,0.75); z-index: 70;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #adminOverlay.active { display: flex; }
  .adminpanel {
    background: var(--card); border-radius: var(--radius); padding: 30px;
    max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto;
  }
  .adminpanel h2 { font-family: 'Archivo', sans-serif; margin-top: 0; color: var(--hunter); }
  .adminpanel input, .adminpanel select, .adminpanel textarea {
    width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 16px; font-family: 'Public Sans', sans-serif;
  }
  .adminpanel label { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
  .adminbtnrow { display: flex; gap: 10px; margin-top: 8px; }
  .adminbtn {
    flex: 1; padding: 13px; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .adminbtn.primary { background: var(--kelly); color: white; }
  .adminbtn.secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .adminbtn.danger { background: #fdecea; color: #b3261e; }
  .adminlistitem {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px;
  }
  .adminlistitem button { background: none; border: none; color: var(--kelly); font-weight: 700; cursor: pointer; font-size: 14px; margin-left: 8px; }
  #adminMsg { font-size: 14px; color: var(--kelly); font-weight: 700; min-height: 20px; }
</style>
</head>

async function loadData() {
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    DATA = JSON.parse(res.value);
  } catch (e) {
    DATA = seedData;
    await saveData();
  }
  renderHome();
}

async function saveData() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
  } catch (e) {
    console.error('save failed', e);
  }
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  clearSearch();
  currentCategory = null;
  showView('view-home');
}

function renderHome() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = '';
  DATA.categories.forEach(cat => {
    const count = DATA.businesses.filter(b => b.category === cat).length;
    const tile = document.createElement('div');
    tile.className = 'catsign';
    tile.onclick = () => openCategory(cat);
    tile.innerHTML = `<div class="catname">${escapeHtml(cat)}</div><div class="catcount">${count} listing${count === 1 ? '' : 's'}</div>`;
    grid.appendChild(tile);
  });
}

function openCategory(cat) {
  currentCategory = cat;
  document.getElementById('listTitle').textContent = cat;
  const items = DATA.businesses.filter(b => b.category === cat).sort((a, b) => a.name.localeCompare(b.name));
  renderAlphaList(items);
  showView('view-list');
}

function renderAlphaList(items) {
  const content = document.getElementById('listContent');
  content.innerHTML = '';
  if (items.length === 0) {
    content.innerHTML = '<div class="emptystate">No listings yet in this category.</div>';
    return;
  }
  let lastLetter = '';
  items.forEach(biz => {
    const letter = biz.name[0].toUpperCase();
    if (letter !== lastLetter) {
      const head = document.createElement('div');
      head.className = 'letterhead';
      head.textContent = letter;
      content.appendChild(head);
      lastLetter = letter;
    }
    const row = document.createElement('div');
    row.className = 'bizrow';
    row.onclick = () => openDetail(biz);
    row.innerHTML = `<div><div class="bizname">${escapeHtml(biz.name)}</div><div class="bizcat">${escapeHtml(biz.subcategory || biz.category)}</div></div><div class="bizarrow">&rsaquo;</div>`;
    content.appendChild(row);
  });
}

function openDetail(biz) {
  const card = document.getElementById('detailCard');
  card.innerHTML = `
    <div class="detailname">${escapeHtml(biz.name)}</div>
    <div class="detailcat">${escapeHtml(biz.subcategory || biz.category)}</div>
    ${biz.address ? `<div class="detailrow" style="border-top:none;"><span class="detaillabel">Address</span><span>${escapeHtml(biz.address)}</span></div>` : `<div class="detailrow" style="border-top:none;color:var(--ink-soft);">No address on file</div>`}
    ${biz.phone ? `<div class="detailrow"><span class="detaillabel">Phone</span><span>${escapeHtml(biz.phone)}</span></div>` : ``}
    <button class="closebtn" onclick="closeDetail()">Close</button>
  `;
  document.getElementById('detailOverlay').classList.add('active');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('active'); }

function doSearch(query) {
  const q = query.trim().toLowerCase();
  document.getElementById('clearBtn').style.display = q ? 'flex' : 'none';
  if (!q) { goHome(); return; }
  document.getElementById('listTitle').textContent = 'Search results';
  const items = DATA.businesses.filter(b => b.name.toLowerCase().includes(q) || b.category.toLowerCase().includes(q) || (b.subcategory || '').toLowerCase().includes(q)).sort((a,b) => a.name.localeCompare(b.name));
  renderAlphaList(items);
  showView('view-list');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
}

/* ---- on-screen keyboard ---- */
const kbRows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
function buildKeyboard() {
  kbRows.forEach((row, i) => {
    const el = document.getElementById('kbrow' + (i + 1));
    el.innerHTML = row.split('').map(ch => `<button class="kbkey" onclick="kbType('${ch}')">${ch}</button>`).join('');
  });
}
buildKeyboard();

function openKeyboard() {
  kbTargetInput = document.getElementById('searchInput');
  document.getElementById('keyboard').classList.add('active');
}
function closeKeyboard() { document.getElementById('keyboard').classList.remove('active'); }
function kbType(ch) {
  if (!kbTargetInput) return;
  kbTargetInput.value += ch;
  triggerInputUpdate();
}
function kbBackspace() {
  if (!kbTargetInput) return;
  kbTargetInput.value = kbTargetInput.value.slice(0, -1);
  triggerInputUpdate();
}
function triggerInputUpdate() {
  if (kbTargetInput.id === 'searchInput') doSearch(kbTargetInput.value);
  else if (kbTargetInput.dataset.adminfield) adminOnFieldChange();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

/* ---- admin ---- */
let editingId = null;

function openAdminGate() {
  const panel = document.getElementById('adminPanelContent');
  panel.innerHTML = `
    <h2>Admin access</h2>
    <label>Enter passcode</label>
    <input type="password" id="gateInput" readonly onclick="kbTargetInput=this;document.getElementById('keyboard').classList.add('active')" data-adminfield="gate">
    <div id="adminMsg"></div>
    <div class="adminbtnrow">
      <button class="adminbtn secondary" onclick="closeAdmin()">Cancel</button>
      <button class="adminbtn primary" onclick="checkGate()">Unlock</button>
    </div>
  `;
  document.getElementById('adminOverlay').classList.add('active');
}
function adminOnFieldChange() {}
function checkGate() {
  const val = document.getElementById('gateInput').value;
  if (val === ADMIN_CODE) { renderAdminHome(); }
  else { document.getElementById('adminMsg').textContent = 'Incorrect passcode.'; document.getElementById('adminMsg').style.color = '#b3261e'; }
}
function closeAdmin() {
  document.getElementById('adminOverlay').classList.remove('active');
  closeKeyboard();
}

function renderAdminHome() {
  const panel = document.getElementById('adminPanelContent');
  let listHtml = DATA.businesses.slice().sort((a,b) => a.name.localeCompare(b.name)).map(b => `
    <div class="adminlistitem">
      <span>${escapeHtml(b.name)} <span style="color:var(--ink-soft);font-weight:400;">— ${escapeHtml(b.category)}</span></span>
      <span><button onclick="openEditForm('${b.id}')">Edit</button><button onclick="deleteBiz('${b.id}')" style="color:#b3261e;">Delete</button></span>
    </div>
  `).join('') || '<div class="adminlistitem">No businesses yet.</div>';

  panel.innerHTML = `
    <h2>Manage directory</h2>
    <div class="adminbtnrow" style="margin-bottom:16px;">
      <button class="adminbtn primary" onclick="openEditForm(null)">Add business</button>
      <button class="adminbtn secondary" onclick="closeAdmin()">Done</button>
    </div>
    <div>${listHtml}</div>
  `;
}

function openEditForm(id) {
  editingId = id;
  const biz = id ? DATA.businesses.find(b => b.id === id) : { name: '', category: DATA.categories[0] || '', subcategory: '', address: '' };
  const panel = document.getElementById('adminPanelContent');
  panel.innerHTML = `
    <h2>${id ? 'Edit business' : 'Add business'}</h2>
    <label>Business name</label>
    <input id="f_name" data-adminfield="1" readonly onclick="focusAdminField(this)" value="${escapeHtml(biz.name)}">
    <label>Category</label>
    <select id="f_category">
      ${DATA.categories.map(c => `<option value="${escapeHtml(c)}" ${c === biz.category ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
      <option value="__new__">+ New category</option>
    </select>
    <input id="f_newcategory" placeholder="New category name" style="display:none;" readonly onclick="focusAdminField(this)">
    <label>Address</label>
    <input id="f_address" readonly onclick="focusAdminField(this)" value="${escapeHtml(biz.address)}">
    <div id="adminMsg"></div>
    <div class="adminbtnrow">
      <button class="adminbtn secondary" onclick="renderAdminHome()">Back</button>
      <button class="adminbtn primary" onclick="saveBizForm()">Save</button>
    </div>
  `;
  document.getElementById('f_category').addEventListener('change', function() {
    document.getElementById('f_newcategory').style.display = this.value === '__new__' ? 'block' : 'none';
  });
}
function focusAdminField(el) {
  kbTargetInput = el;
  document.getElementById('keyboard').classList.add('active');
}

async function saveBizForm() {
  const name = document.getElementById('f_name').value.trim();
  let category = document.getElementById('f_category').value;
  if (category === '__new__') {
    category = document.getElementById('f_newcategory').value.trim();
    if (category && !DATA.categories.includes(category)) DATA.categories.push(category);
  }
  if (!name || !category) {
    document.getElementById('adminMsg').textContent = 'Name and category are required.';
    document.getElementById('adminMsg').style.color = '#b3261e';
    return;
  }
  const record = {
    id: editingId || 'b' + Date.now(),
    name,
    category,
    subcategory: category,
    address: document.getElementById('f_address').value.trim()
  };
  if (editingId) {
    const idx = DATA.businesses.findIndex(b => b.id === editingId);
    DATA.businesses[idx] = record;
  } else {
    DATA.businesses.push(record);
  }
  await saveData();
  renderHome();
  renderAdminHome();
}

async function deleteBiz(id) {
  DATA.businesses = DATA.businesses.filter(b => b.id !== id);
  await saveData();
  renderHome();
  renderAdminHome();
}

loadData();
